name: Build OpenTranscribe Linux

on:
  push:
    tags:
      - 'v*' # Se ejecuta cuando subes un tag (ej: v1.0.0)
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  build:
    # Versión fija y antigua a propósito: tanto whisper-cli como el ejecutable de
    # PyInstaller exigen la glibc con la que se compilan, así que la más antigua
    # posible amplía las distros soportadas (22.04 = glibc 2.35; ubuntu-latest
    # dejaría fuera Debian 12, Ubuntu 22.04, etc.)
    runs-on: ubuntu-22.04

    steps:
    # 1. Bajar el código
    - uses: actions/checkout@v4

    # 2. Preparar Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Instalar dependencias del sistema (necesarias para compilar)
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk tk-dev libsdl2-dev ffmpeg ruby-full rpm
        # Instalar FPM (para crear .deb y .rpm)
        sudo gem install fpm

    # 4. Instalar dependencias de Python
    - name: Install Python Dependencies
      run: |
        pip install --upgrade pip
        pip install pyinstaller
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Aseguramos que tkinterdnd2 esté (a veces da guerra en requirements)
        pip install tkinterdnd2 pygame customtkinter Pillow requests

    # 5. Compilar whisper-cli estático y portable (ver build_whisper.sh)
    - name: Build Whisper Binary
      run: |
        sudo apt-get install -y cmake g++
        ./build_whisper.sh

    # 6. Versión: sale del tag y se usa para la app (_version.py) y para los paquetes.
    #    dpkg y rpm exigen que empiece por un dígito
    #     (tag "v1.2.0" -> "1.2.0"; lanzado a mano sin tag -> "0.0.0+git<commit>")
    - name: Package Version
      run: |
        if [ "${{ github.ref_type }}" = "tag" ]; then
          VERSION="${GITHUB_REF_NAME#v}"
        else
          VERSION="0.0.0+git${GITHUB_SHA::7}"
        fi
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        # La app lee su versión de aquí (no está en git; en local vale "dev")
        echo "__version__ = \"$VERSION\"" > _version.py
        echo "Versión del paquete: $VERSION"

    # 6b. Crear el Ejecutable (PyInstaller)
    - name: Build Binary with PyInstaller
      run: |
        # --onedir: con --onefile todo se extraía a /tmp en cada arranque (más lento
        # y no arranca si /tmp está montado con noexec)
        pyinstaller --noconfirm --onedir --windowed \
          --name "OpenTranscribe" \
          --icon="icon.png" \
          --add-data "binaries_linux:binaries_linux" \
          --add-data "Logo.jpg:." \
          --add-data "icon.png:." \
          --hidden-import="PIL._tkinter_finder" \
          --hidden-import="tkinter" \
          --hidden-import="tkinterdnd2" \
          main.py

    # 7. Crear estructura de carpetas para el paquete (.deb/.rpm)
    - name: Prepare Package Structure
      run: |
        mkdir -p package_root/opt
        mkdir -p package_root/usr/bin
        mkdir -p package_root/usr/share/applications
        mkdir -p package_root/usr/share/pixmaps

        # La aplicación (carpeta de PyInstaller) en /opt y un enlace en /usr/bin
        cp -a dist/OpenTranscribe package_root/opt/opentranscribe
        ln -s /opt/opentranscribe/OpenTranscribe package_root/usr/bin/opentranscribe

        # Carpeta suelta para quien no quiera instalar paquete
        tar -C dist -czf OpenTranscribe-linux-x64.tar.gz OpenTranscribe

        # Copiar el icono al sistema
        cp icon.png package_root/usr/share/pixmaps/opentranscribe.png

    # 8. Generar archivo .desktop
    - name: Generate .desktop file
      run: |
        cat <<EOF > package_root/usr/share/applications/opentranscribe.desktop
        [Desktop Entry]
        Name=OpenTranscribe
        Comment=Herramienta de transcripción automática con IA
        Exec=/usr/bin/opentranscribe %f
        Icon=opentranscribe
        Terminal=false
        Type=Application
        Categories=AudioVideo;Audio;Utility;
        MimeType=audio/mpeg;audio/x-wav;video/mp4;video/x-matroska;
        Keywords=transcription;whisper;subtitles;
        StartupNotify=true
        EOF

    # Dependencias: solo ffmpeg. SDL2 no hace falta: pygame trae la suya y va dentro
    # del paquete. En el .rpm se pide el fichero /usr/bin/ffmpeg y no un paquete
    # "ffmpeg", porque cada distro lo llama distinto (Fedora: ffmpeg-free;
    # RPM Fusion: ffmpeg; openSUSE: ffmpeg-9...) y todos instalan ese fichero.

    # 9. Crear paquete .DEB (Debian/Ubuntu/Mint)
    - name: Build DEB Package
      run: |
        fpm -s dir -t deb \
          -n opentranscribe \
          -v "$VERSION" \
          -a x86_64 \
          --maintainer "AnabasaSoft <anabasasoft@gmail.com>" \
          --license "GPL-3.0-or-later" \
          --url "https://github.com/AnabasaSoft/OpenTranscribe" \
          --description "Transcriptor de audio y video usando Whisper.cpp local." \
          --depends ffmpeg \
          -C package_root .

        # Renombrar para que quede bonito (ej: OpenTranscribe-v1.0.0-linux-x64.deb)
        mv *.deb OpenTranscribe-linux-x64.deb

    # 10. Crear paquete .RPM (Fedora/RedHat/OpenSUSE)
    - name: Build RPM Package
      run: |
        fpm -s dir -t rpm \
          -n opentranscribe \
          -v "$VERSION" \
          -a x86_64 \
          --maintainer "AnabasaSoft <anabasasoft@gmail.com>" \
          --license "GPL-3.0-or-later" \
          --url "https://github.com/AnabasaSoft/OpenTranscribe" \
          --description "Transcriptor de audio y video usando Whisper.cpp local." \
          --depends /usr/bin/ffmpeg \
          --rpm-rpmbuild-define "_build_id_links none" \
          -C package_root .

        mv *.rpm OpenTranscribe-linux-x64.rpm

    # 11. Subir los artefactos a la acción (para descargarlos manual)
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Linux-Packages
        path: |
          OpenTranscribe-linux-x64.tar.gz
          OpenTranscribe-linux-x64.deb
          OpenTranscribe-linux-x64.rpm

    # 12. Publicar Release (Opcional - crea la release en GitHub automáticamente)
    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          OpenTranscribe-linux-x64.tar.gz
          OpenTranscribe-linux-x64.deb
          OpenTranscribe-linux-x64.rpm
